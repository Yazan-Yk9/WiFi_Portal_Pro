<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة / Admin Login</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 { color: #2d3748; margin-bottom: 8px; font-size: 24px; }
        p { color: #718096; margin-bottom: 25px; font-size: 14px; }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .error {
            color: #e53e3e;
            font-size: 14px;
            margin-bottom: 15px;
            padding: 10px;
            background: #fed7d7;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Admin Login / دخول الإدارة</h2>
        <p>Enter admin password to access dashboard / أدخل كلمة مرور الإدارة</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/admin">
            <input type="password" name="password" placeholder="Password / كلمة المرور" required autofocus>
            <button type="submit">Login / تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
