events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 1M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    geo $remote_addr $is_whitelisted {
        default 0;
        include /etc/whitelist.txt;
    }

    server {
        listen 192.168.50.1:80 default_server;
        server_name _;
        access_log off;
        
        location / {

            if ($is_whitelisted = 1) {
                return 204;
            }
            return 302 http://192.168.50.1;
        }
    }

    server {
        listen 192.168.50.1:80;
        server_name 192.168.50.1;
        root /var/www/html;
        index index.html;
        
        location ~* (generate_204|success\.txt|connecttest|ncsi\.txt|captiveportal) {
            access_log off;
            add_header Content-Type "text/plain";
            return 204;
        }
        location / {
            if ($host != "192.168.50.1") {
                return 302 http://192.168.50.1;
            }
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
        }

        location = /api/login {
            proxy_pass http://127.0.0.1:5000/api/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://127.0.0.1:5000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            access_log off;
        }

        location /admin {
            proxy_pass http://127.0.0.1:5000/admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 404 /index.html;
    }
}
